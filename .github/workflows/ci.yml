name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install JavaScript dependencies
        run: bun ci

      - name: Install Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy

      - name: Check version consistency
        run: bun run version:check

      - name: Check architecture rules
        run: bun run architecture:check

      - name: Check generated IPC types
        run: bun run ipc:check

      - name: Audit JavaScript dependencies
        run: bun audit --audit-level=high

      - name: Install cargo-audit
        run: cargo +1.97.1 install cargo-audit --version 0.22.2 --locked

      - name: Audit Rust dependencies
        run: cargo +1.97.1 audit

      - name: Check formatting
        run: bun run format:check

      - name: Lint frontend
        run: bun run lint

      - name: Type-check frontend
        run: bun run typecheck

      - name: Run frontend tests
        run: bun run test

      - name: Build static frontend export
        run: bun run build

      - name: Check Rust formatting
        run: cargo +1.97.1 fmt --all -- --check

      - name: Lint Rust
        run: cargo +1.97.1 clippy --workspace --all-targets -- -D warnings

      - name: Test Rust
        run: cargo +1.97.1 test --workspace

      - name: Compile Windows desktop host
        run: bun run --filter @qbit/desktop tauri build --no-bundle

  portability:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal

      - name: Test portable Rust crates
        run: cargo +1.97.1 test -p feature-api -p app-runtime -p persistence -p ipc-contracts -p diagnostics
