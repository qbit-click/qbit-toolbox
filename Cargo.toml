[workspace]
members = ["crates/feature-api", "crates/app-runtime", "crates/persistence", "crates/ipc-contracts", "crates/diagnostics", "apps/desktop/src-tauri"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
tempfile = "3"
serde = { version = "1", features = ["derive"] }
ts-rs = "10"
