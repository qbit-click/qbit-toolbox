[workspace]
members = ["crates/feature-api", "crates/app-runtime", "crates/persistence", "crates/ipc-contracts", "crates/diagnostics", "apps/desktop/src-tauri", "features/hotkeys/native"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
proptest = "1"
ts-rs = "12"
